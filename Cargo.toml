[package]
name = "simple-bot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# v0.5.10-catscope carries the minimal root-level target/*.json fixtures
# (see catscope-rust-bot's own commit bd0625c) build.rs needs -- earlier
# tags predate that fix and have nothing for build.rs to read (no
# contrib/ on this mirror, no target/*.json at the repo root either).
catscope-rust-bot = { git = "https://github.com/noncepad/catscope-rust-bot.git", tag = "v0.5.11-catscope", default-features = false }
#catscope-rust-bot = { path = "../catscope-rust-bot", default-features = false }
# Versions mirror catscope-rust-bot's own Cargo.toml exactly -- these are
# used directly by the copied brain module (see src/brain/testperpv1),
# not by this crate's own lib.rs.
solana-sdk = "3.0.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
spl-token = { version = "9", features = ["no-entrypoint"] }
